name: dual-audit-eco
on:
  pull_request:
    paths:
      - 'docs/reviews/dual_audit_2026-10-19/eco/**'
      - '.github/workflows/dual-audit-eco.yml'
permissions:
  contents: write
concurrency:
  group: dual-audit-eco-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == 'magic-alt/fpga-servo' && github.event.pull_request.head.ref == 'fix/dual-servo-audit-20261019'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install native verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common ngspice
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-symbols kicad-footprints
          cfg="$HOME/.config/kicad/10.0"
          mkdir -p "$cfg" artifacts/eco
          printf '(sym_lib_table\n  (version 7)\n)\n' > "$cfg/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$cfg/fp-lib-table"
          kicad-cli --version
          git rev-parse HEAD > artifacts/eco/controller-revision.txt
          git archive --format=zip --output=artifacts/eco/before-source.zip HEAD
          kicad-cli sch export netlist --format kicadxml --output artifacts/eco/ads-before.xml hardware/ads8588s_servo/ax7010_servo_reva.kicad_sch
          kicad-cli sch export netlist --format kicadxml --output artifacts/eco/ad-before.xml hardware/ad7606c_servo/ax7010_servo_ad7606c.kicad_sch
      - name: Apply only the reviewed exact-byte ECO
        run: |
          /usr/bin/python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root = Path.cwd().resolve()
          spec_path = Path('docs/reviews/dual_audit_2026-10-19/eco/current.json')
          spec = json.loads(spec_path.read_text())
          def digest(p):
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None
          assert spec['schema'] == 1
          patch = Path(spec['patch'])
          assert patch.as_posix() == 'docs/reviews/dual_audit_2026-10-19/eco/current.patch'
          transport = spec.get('transport_gzip')
          if transport:
              import gzip
              packed = Path(transport['path'])
              assert packed.as_posix() == 'docs/reviews/dual_audit_2026-10-19/eco/current.patch.gz'
              packed_bytes = b''.join(packed.with_name(packed.name + '.part' + str(i)).read_bytes() for i in range(3))
              assert len(packed_bytes) < 1000000 and hashlib.sha256(packed_bytes).hexdigest() == transport['sha256']
              content = gzip.decompress(packed_bytes)
              assert len(content) == transport['uncompressed_bytes'] and len(content) < 4000000
              assert hashlib.sha256(content).hexdigest() == spec['patch_sha256']
              patch.write_bytes(content)
          assert digest(patch) == spec['patch_sha256'], 'Patch checksum mismatch'
          paths = [r['path'] for r in spec['files']]
          assert paths and len(paths) == len(set(paths))
          for name in paths:
              p = Path(name)
              assert p.as_posix() == name and not p.is_absolute() and '..' not in p.parts
              assert p.parts[0] in {'hardware', 'tools', 'docs'}
              assert not any(x.startswith('.env') or x == '.git' for x in p.parts)
              assert not p.is_symlink() and p.resolve().is_relative_to(root)
          current = {n: digest(Path(n)) for n in paths}
          before = all(current[r['path']] == r['before_sha256'] for r in spec['files'])
          after = all(current[r['path']] == r.get('native_after_sha256', r.get('overlay_after_sha256', r['after_sha256'])) for r in spec['files'])
          assert before or after, 'Mixed/stale source; refusing to overwrite work'
          if before and not after:
              changed = subprocess.check_output(['git', 'apply', '--numstat', str(patch)], text=True)
              assert sorted(line.split('\t')[2] for line in changed.splitlines()) == sorted(paths)
              subprocess.run(['git', 'apply', '--check', '--ignore-whitespace', str(patch)], check=True)
              subprocess.run(['git', 'apply', '--ignore-whitespace', str(patch)], check=True)
              for name in spec.get('normalize_crlf', []):
                  assert name in paths and name.startswith('hardware/')
                  p = Path(name)
                  p.write_bytes(p.read_bytes().replace(b'\r\n', b'\n').replace(b'\n', b'\r\n'))
              assert all(digest(Path(r['path'])) == r['after_sha256'] for r in spec['files']), 'Literal ECO checksum mismatch'
              overlay = spec.get('overlay_patch')
              if overlay:
                  correction = Path(overlay['path'])
                  assert correction.as_posix() == 'docs/reviews/dual_audit_2026-10-19/eco/normalization.patch'
                  assert digest(correction) == overlay['sha256']
                  stats = subprocess.check_output(['git', 'apply', '--numstat', str(correction)], text=True)
                  assert sorted(line.split('\t')[2] for line in stats.splitlines()) == sorted(overlay['files'])
                  assert set(overlay['files']).issubset(set(paths))
                  subprocess.run(['git', 'apply', '--check', str(correction)], check=True)
                  subprocess.run(['git', 'apply', str(correction)], check=True)
                  assert all(digest(Path(r['path'])) == r.get('overlay_after_sha256', r['after_sha256']) for r in spec['files'])
              if spec.get('refill_boards'):
                  import sys, pcbnew
                  sys.path.insert(0, str(root / 'tools'))
                  from pcbtools.board import non_fill_design_signature
                  proof = {}
                  for name in spec['refill_boards']:
                      assert name in paths and name.endswith('.kicad_pcb') and name.startswith('hardware/')
                      p = Path(name)
                      original = p.read_text()
                      expected = non_fill_design_signature(original)
                      board = pcbnew.LoadBoard(str(p))
                      pcbnew.ZONE_FILLER(board).Fill(board.Zones())
                      output = Path('artifacts/eco') / ('refilled-' + p.name)
                      pcbnew.SaveBoard(str(output), board)
                      assert non_fill_design_signature(output.read_text()) == expected, 'Native refill changed non-cache design; inspect artifact and do not commit'
                      p.write_bytes(output.read_bytes())
                      record = next(r for r in spec['files'] if r['path'] == name)
                      record['native_after_sha256'] = digest(p)
                      proof[name] = {'literal_patch_sha256': record['after_sha256'], 'canonical_native_sha256': digest(p), 'non_fill_design_signature': expected, 'non_fill_design_equal': True}
                  Path('artifacts/eco/native-refill-proof.json').write_text(json.dumps(proof, indent=2)+'\n')
                  manifest_path = Path('hardware/ad7606c_servo/source_manifest.json')
                  assert manifest_path.as_posix() in paths
                  manifest = json.loads(manifest_path.read_text())
                  for name in spec['refill_boards']:
                      if name not in manifest['files']:
                          continue
                      p = Path(name)
                      manifest['files'][name] = digest(p)
                      manifest['text_sha256_lf'][name] = hashlib.sha256(p.read_text().encode()).hexdigest()
                      transition = next(r for r in manifest['native_dfm_transition']['changes'] if r['path'] == name)
                      transition['native_after_sha256'] = digest(p)
                      transition['native_after_lf_sha256'] = manifest['text_sha256_lf'][name]
                  manifest_path.write_text(json.dumps(manifest, indent=2)+'\n', newline='\r\n')
                  manifest_record = next(r for r in spec['files'] if r['path'] == manifest_path.as_posix())
                  manifest_record['native_after_sha256'] = digest(manifest_path)
                  spec_path.write_text(json.dumps(spec, indent=2)+'\n')
          assert all(digest(Path(r['path'])) == r.get('native_after_sha256', r.get('overlay_after_sha256', r['after_sha256'])) for r in spec['files']), 'ECO output checksum mismatch'
          paths.extend([spec_path.as_posix(), patch.as_posix()])
          subprocess.run(['git', 'add', '--', *paths], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert set(staged).issubset(set(paths)), 'Unexpected staged source'
          Path('artifacts/eco/applied-manifest.json').write_text(json.dumps(spec, indent=2)+'\n')
          print('Exact reviewed ECO bytes present; native qualification follows.')
          PY
      - name: Complete regression and both-board native CAD checks
        run: |
          set -euo pipefail
          python3 tools/pcb.py test --kicad-cli kicad-cli --ngspice ngspice --pcb-python /usr/bin/python3 2>&1 | tee artifacts/eco/regression.log
          /usr/bin/python3 tools/pcb.py verify --project ads8588s --scope pcb 2>&1 | tee artifacts/eco/ads8588s-pcb.log
          /usr/bin/python3 tools/pcb.py verify --project ad7606c --scope pcb 2>&1 | tee artifacts/eco/ad7606c-pcb.log
          kicad-cli sch export netlist --format kicadxml --output artifacts/eco/ads-after.xml hardware/ads8588s_servo/ax7010_servo_reva.kicad_sch
          kicad-cli sch export netlist --format kicadxml --output artifacts/eco/ad-after.xml hardware/ad7606c_servo/ax7010_servo_ad7606c.kicad_sch
          python3 .agents/skills/schematic-humanizer/scripts/compare_connectivity.py artifacts/eco/ads-before.xml artifacts/eco/ads-after.xml | tee artifacts/eco/ads-connectivity.log
          python3 .agents/skills/schematic-humanizer/scripts/compare_connectivity.py artifacts/eco/ad-before.xml artifacts/eco/ad-after.xml | tee artifacts/eco/ad-connectivity.log
          git diff --exit-code
      - name: Commit verified source without replacing newer work
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! git diff --cached --quiet; then
            actual=$(git ls-remote origin refs/heads/fix/dual-servo-audit-20261019 | cut -f1)
            test "$actual" = "$EXPECTED_HEAD"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            stage=$(python3 -c "import json; print(json.load(open('docs/reviews/dual_audit_2026-10-19/eco/current.json'))['stage'])")
            git commit -m "fix(hardware): apply verified $stage"
            git push origin HEAD:refs/heads/fix/dual-servo-audit-20261019
          fi
          git rev-parse HEAD > artifacts/eco/verified-revision.txt
          git archive --format=zip --output=artifacts/eco/verified-source.zip HEAD
          sha256sum artifacts/eco/*source.zip > artifacts/eco/source-SHA256SUMS
      - name: Preserve actual source and native evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-audit-eco-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
