name: gate-ab-electrical
on:
  workflow_dispatch:
    inputs:
      pcb_release:
        description: "Run strict PCB/DRC and engineering gates (currently blocked)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "hardware/**"
      - "tools/**"
      - "docs/**"
      - ".github/workflows/gate-ab-electrical.yml"
  push:
    branches: [main]
    paths:
      - "hardware/**"
      - "tools/**"
jobs:
  gate-ab-automated-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native KiCad 10 and ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common ngspice
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-symbols kicad-footprints
          kicad-cli --version
          ngspice --version
      - name: Preseed KiCad library tables
        run: |
          cfg="$HOME/.config/kicad/10.0"
          mkdir -p "$cfg"
          printf '(sym_lib_table\n  (version 7)\n)\n' > "$cfg/sym-lib-table"
          if [ -f /usr/share/kicad/template/fp-lib-table ]; then
            cp /usr/share/kicad/template/fp-lib-table "$cfg/fp-lib-table"
          else
            printf '(fp_lib_table\n  (version 7)\n)\n' > "$cfg/fp-lib-table"
          fi
      - name: Run evidence isolation regressions
        run: python tools/pcb.py test --pattern test_run_gate_ab.py
      - name: Collect native evidence through the shared entry
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.pcb_release }}" = "true" ]; then
            python tools/pcb.py verify --project ads8588s --scope release
          else
            python tools/pcb.py verify --project ads8588s --scope schematic
          fi
      - name: Upload reviewable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-ab-electrical-evidence
          path: artifacts/pcb/ads8588s/
          if-no-files-found: warn
