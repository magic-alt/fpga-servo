name: hardware-sanity
on:
  push:
  pull_request:
jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/pcb.py check --project ads8588s --scope schematic
      - run: python tools/pcb.py check --project ad7606c --scope schematic
      - run: python tools/pcb.py test --lane static
