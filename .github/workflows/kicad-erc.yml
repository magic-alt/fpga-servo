name: kicad-erc

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'hardware/**'
      - '.github/workflows/kicad-erc.yml'

jobs:
  erc:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad 10 CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints kicad-symbols
          kicad-cli --version
          kicad-cli sch erc --help

      - name: Diagnose standalone and hierarchical netlists
        run: |
          mkdir -p artifacts/netlists
          cd hardware
          for sch in \
            power_input.sch \
            aux_power.sch \
            gate_inverter.sch \
            current_adc.sch \
            encoder.sch \
            ax7010_interface.sch \
            ax7010_servo_reva.sch
          do
            stem="${sch%.sch}"
            kicad-cli sch export netlist \
              --output "../artifacts/netlists/${stem}.net" \
              "$sch"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("../artifacts/netlists")
          total_components = 0
          for path in sorted(root.glob("*.net")):
              text = path.read_text()
              components = len(re.findall(r"\(comp\s+\(ref\s+", text))
              nets = len(re.findall(r"\(net\s+\(code\s+", text))
              print(f"{path.stem}: components={components} nets={nets}")
              if path.stem != "ax7010_servo_reva":
                  total_components += components
          if total_components != 124:
              raise SystemExit(f"standalone child component total expected 124, got {total_components}")
          top = (root / "ax7010_servo_reva.net").read_text()
          top_components = len(re.findall(r"\(comp\s+\(ref\s+", top))
          top_nets = len(re.findall(r"\(net\s+\(code\s+", top))
          if top_components != 124 or top_nets == 0:
              raise SystemExit(
                  f"hierarchical netlist invalid: components={top_components} nets={top_nets}"
              )
          PY
          cp ../artifacts/netlists/ax7010_servo_reva.net ../artifacts/ax7010_servo_reva.net
          grep -n -E 'J3|F1|U2|U1|VIN_RAW|VBUS_PROT|IU_ADC|PWM_UH' ../artifacts/ax7010_servo_reva.net | head -n 120 || true

      - name: Run KiCad ERC
        run: |
          mkdir -p artifacts
          set +e
          cd hardware
          kicad-cli sch erc \
            --exit-code-violations \
            --severity-all \
            --output ../artifacts/ax7010_servo_reva_erc.rpt \
            ax7010_servo_reva.sch
          rc=$?
          set -e
          cat ../artifacts/ax7010_servo_reva_erc.rpt || true
          exit $rc

      - name: Upload ERC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-erc-report
          path: |
            artifacts/ax7010_servo_reva_erc.rpt
            artifacts/ax7010_servo_reva.net
            artifacts/netlists/*.net
          if-no-files-found: warn
