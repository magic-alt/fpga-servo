name: kicad-erc

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'hardware/**'
      - '.github/workflows/kicad-erc.yml'

jobs:
  erc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad 10 and headless GUI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            kicad kicad-footprints kicad-symbols \
            xvfb xdotool scrot dbus-x11 x11-utils
          kicad-cli --version

      - name: Preseed KiCad 10 user configuration
        run: |
          cfg="$HOME/.config/kicad/10.0"
          mkdir -p "$cfg"

          cat >"$cfg/kicad_common.json" <<'JSON'
          {
            "meta": {
              "filename": "kicad_common.json",
              "version": 6
            },
            "do_not_show_again": {
              "data_collection_prompt": true,
              "update_check_prompt": true
            }
          }
          JSON

          # Avoid first-run library-table dialogs.  The project also carries a
          # project-local sym-lib-table for ax7010_servo_reva.
          if [ -f /usr/share/kicad/template/sym-lib-table ]; then
            cp /usr/share/kicad/template/sym-lib-table "$cfg/sym-lib-table"
          else
            printf '(sym_lib_table)\n' > "$cfg/sym-lib-table"
          fi

          if [ -f /usr/share/kicad/template/fp-lib-table ]; then
            cp /usr/share/kicad/template/fp-lib-table "$cfg/fp-lib-table"
          else
            printf '(fp_lib_table)\n' > "$cfg/fp-lib-table"
          fi

          python3 -m json.tool "$cfg/kicad_common.json" >/dev/null
          ls -la "$cfg"

      - name: Convert legacy hierarchy with Eeschema
        run: |
          mkdir -p artifacts
          cd hardware

          Xvfb :99 -screen 0 1920x1080x24 -ac \
            >../artifacts/xvfb.log 2>&1 &
          xvfb_pid=$!
          export DISPLAY=:99
          export NO_AT_BRIDGE=1
          export XDG_RUNTIME_DIR=/tmp/kicad-xdg-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          ready=0
          for i in $(seq 1 30); do
            if xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          echo "DISPLAY=$DISPLAY X-ready=$ready"
          xdpyinfo -display "$DISPLAY" | head -n 20 || true
          if [ "$ready" -ne 1 ]; then
            cat ../artifacts/xvfb.log || true
            kill "$xvfb_pid" 2>/dev/null || true
            exit 21
          fi

          eeschema ax7010_servo_reva.sch \
            >../artifacts/eeschema.log 2>&1 &
          eeschema_pid=$!
          echo "eeschema pid=$eeschema_pid"

          loaded=""
          for i in $(seq 1 90); do
            sleep 1

            for wid in $(xdotool search --onlyvisible --name "KiCad Setup" 2>/dev/null || true); do
              echo "unexpected KiCad Setup dialog after config preseed"
              scrot ../artifacts/unexpected-kicad-setup.png || true
              kill "$eeschema_pid" 2>/dev/null || true
              kill "$xvfb_pid" 2>/dev/null || true
              exit 23
            done

            for pattern in "Configure Global Symbol Library Table" "Project Rescue Helper" "Remap Symbols"; do
              for wid in $(xdotool search --onlyvisible --name "$pattern" 2>/dev/null || true); do
                echo "accepting dialog: $(xdotool getwindowname "$wid" 2>/dev/null || true)"
                xdotool key --window "$wid" Return 2>/dev/null || true
              done
            done

            for wid in $(xdotool search --onlyvisible --name "Schematic Editor" 2>/dev/null || true); do
              name=$(xdotool getwindowname "$wid" 2>/dev/null || true)
              case "$name" in
                *ax7010_servo_reva*|*"AX7010 Servo Drive"*)
                  loaded="$wid"
                  break 2
                  ;;
              esac
            done
          done

          echo "visible windows after load:"
          for wid in $(xdotool search --onlyvisible --name ".*" 2>/dev/null || true); do
            printf "%s " "$wid"
            xdotool getwindowname "$wid" 2>/dev/null || true
          done
          scrot ../artifacts/eeschema-loaded.png || true

          if [ -z "$loaded" ]; then
            echo "target schematic window was not loaded"
            cat ../artifacts/eeschema.log || true
            kill "$eeschema_pid" 2>/dev/null || true
            kill "$xvfb_pid" 2>/dev/null || true
            exit 22
          fi

          echo "loaded schematic window=$loaded"
          xdotool windowactivate --sync "$loaded" 2>/dev/null || true
          xdotool key --window "$loaded" ctrl+s
          sleep 3

          # Saving a pre-v6 schematic writes native .kicad_sch. Accept the
          # proposed modern filename and normal upgrade confirmations.
          for i in $(seq 1 45); do
            sleep 1
            for pattern in "Save As" "Confirm" "Warning" "Rescue Symbols"; do
              for wid in $(xdotool search --onlyvisible --name "$pattern" 2>/dev/null || true); do
                name=$(xdotool getwindowname "$wid" 2>/dev/null || true)
                case "$name" in
                  *"Schematic Editor"*) ;;
                  *)
                    echo "accepting save dialog: $name"
                    xdotool key --window "$wid" Return 2>/dev/null || true
                    ;;
                esac
              done
            done
            [ -s ax7010_servo_reva.kicad_sch ] && break
          done

          sleep 2
          scrot ../artifacts/eeschema-after-save.png || true
          echo "native files after save:"
          ls -lh *.kicad_sch 2>/dev/null || true
          cat ../artifacts/eeschema.log || true

          xdotool key --window "$loaded" alt+F4 2>/dev/null || true
          sleep 2
          kill "$eeschema_pid" 2>/dev/null || true
          kill "$xvfb_pid" 2>/dev/null || true

          test -s ax7010_servo_reva.kicad_sch

      - name: Verify converted hierarchy exports a populated netlist
        run: |
          mkdir -p artifacts
          cd hardware
          kicad-cli sch export netlist \
            --output ../artifacts/ax7010_servo_reva.net \
            ax7010_servo_reva.kicad_sch

          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path("../artifacts/ax7010_servo_reva.net").read_text()
          components = len(re.findall(r"\(comp\s+\(ref\s+", text))
          nets = len(re.findall(r"\(net\s+\(code\s+", text))
          print(f"native netlist components={components} nets={nets}")
          if components != 124:
              raise SystemExit(f"expected 124 components, got {components}")
          if nets == 0:
              raise SystemExit("native netlist contains zero nets")
          PY

      - name: Run KiCad 10 ERC on converted hierarchy
        run: |
          mkdir -p artifacts
          set +e
          cd hardware
          kicad-cli sch erc \
            --exit-code-violations \
            --severity-all \
            --output ../artifacts/ax7010_servo_reva_erc.rpt \
            ax7010_servo_reva.kicad_sch
          rc=$?
          set -e
          cat ../artifacts/ax7010_servo_reva_erc.rpt || true
          exit "$rc"

      - name: Verify source hierarchy contract
        run: |
          python tools/check_schematic_connectivity.py
          python tools/check_schematic_layout.py

      - name: Upload conversion and ERC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-erc-report
          path: |
            artifacts/**
            hardware/*.kicad_sch
          if-no-files-found: warn
