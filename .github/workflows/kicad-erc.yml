name: kicad-erc

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'hardware/**'
      - '.github/workflows/kicad-erc.yml'

jobs:
  erc:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad 10 CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            kicad kicad-footprints kicad-symbols
          kicad-cli --version
          kicad-cli sch erc --help

      - name: Verify each functional sheet exports a real netlist
        run: |
          mkdir -p artifacts
          cd hardware

          check_sheet() {
            sch="$1"
            expected="$2"
            stem="${sch%.sch}"

            # Apply the project ERC configuration to each standalone child-sheet
            # validation run.  The child source remains untouched.
            cp ax7010_servo_reva.kicad_pro "${stem}.kicad_pro"

            kicad-cli sch export netlist \
              --output "../artifacts/${stem}.net" \
              "$sch"

            python3 - "$stem" "$expected" <<'PY'
          from pathlib import Path
          import re
          import sys

          stem = sys.argv[1]
          expected = int(sys.argv[2])
          text = Path(f"../artifacts/{stem}.net").read_text()
          components = len(re.findall(r"\(comp\s+\(ref\s+", text))
          nets = len(re.findall(r"\(net\s+\(code\s+", text))
          print(f"{stem}: components={components} nets={nets}")
          if components != expected:
              raise SystemExit(f"{stem}: expected {expected} components, got {components}")
          if nets == 0:
              raise SystemExit(f"{stem}: exported zero nets")
          PY
          }

          check_sheet power_input.sch 18
          check_sheet aux_power.sch 20
          check_sheet gate_inverter.sch 42
          check_sheet current_adc.sch 33
          check_sheet encoder.sch 9
          check_sheet ax7010_interface.sch 2

      - name: Run KiCad 10 ERC on all functional sheets
        run: |
          mkdir -p artifacts
          cd hardware
          failed=0
          for sch in \
            power_input.sch \
            aux_power.sch \
            gate_inverter.sch \
            current_adc.sch \
            encoder.sch \
            ax7010_interface.sch
          do
            stem="${sch%.sch}"
            echo "===== ERC: $sch ====="
            set +e
            kicad-cli sch erc \
              --exit-code-violations \
              --severity-all \
              --output "../artifacts/${stem}_erc.rpt" \
              "$sch"
            rc=$?
            set -e
            cat "../artifacts/${stem}_erc.rpt" || true
            if [ "$rc" -ne 0 ]; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Verify top-level hierarchy contract
        run: |
          python tools/check_schematic_connectivity.py
          python tools/check_schematic_layout.py

      - name: Upload ERC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-erc-report
          path: artifacts/**
          if-no-files-found: warn
