name: kicad-erc

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'hardware/**'
      - '.github/workflows/kicad-erc.yml'

jobs:
  erc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad 10 and GUI automation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            kicad kicad-footprints kicad-symbols xvfb xdotool scrot dbus-x11
          kicad-cli --version
          eeschema --help || true

      - name: Convert legacy hierarchy through Eeschema
        run: |
          mkdir -p artifacts
          cd hardware
          set +e
          xvfb-run -a bash -c '
            set -u
            export NO_AT_BRIDGE=1
            eeschema ax7010_servo_reva.sch >../artifacts/eeschema.log 2>&1 &
            pid=$!
            echo "eeschema pid=$pid"

            # Allow first-start/library/rescue dialogs to appear, then accept the
            # default non-destructive choices. The project carries its KiCad-5
            # cache library, so no symbol rescue should be required.
            for i in $(seq 1 30); do
              sleep 1
              xdotool search --onlyvisible --name "Configure Global Symbol Library Table" key Return 2>/dev/null || true
              xdotool search --onlyvisible --name "Project Rescue Helper" key Return 2>/dev/null || true
              xdotool search --onlyvisible --name "Remap Symbols" key Return 2>/dev/null || true
              if xdotool search --onlyvisible --name "Schematic Editor" >/tmp/eeschema_windows 2>/dev/null; then
                break
              fi
            done

            echo "visible windows before save:"
            for wid in $(xdotool search --onlyvisible --name ".*" 2>/dev/null || true); do
              printf "%s " "$wid"
              xdotool getwindowname "$wid" 2>/dev/null || true
            done

            wid=$(xdotool search --onlyvisible --name "Schematic Editor" 2>/dev/null | tail -n1)
            if [ -z "$wid" ]; then
              scrot ../artifacts/eeschema-no-window.png || true
              kill "$pid" 2>/dev/null || true
              exit 20
            fi

            xdotool windowactivate --sync "$wid"
            xdotool key --window "$wid" ctrl+s
            sleep 3

            # Legacy save may show a filename/upgrade confirmation. Accept the
            # proposed modern .kicad_sch destination without changing source.
            for i in $(seq 1 15); do
              sleep 1
              for did in $(xdotool search --onlyvisible --name "Save|Confirm|Warning|Rescue|Schematic" 2>/dev/null || true); do
                name=$(xdotool getwindowname "$did" 2>/dev/null || true)
                case "$name" in
                  *"Save"*|*"Confirm"*|*"Warning"*|*"Rescue"*)
                    xdotool windowactivate "$did" 2>/dev/null || true
                    xdotool key Return 2>/dev/null || true
                    ;;
                esac
              done
              ls *.kicad_sch >/dev/null 2>&1 && break
            done

            sleep 3
            scrot ../artifacts/eeschema-after-save.png || true
            echo "native files:"
            ls -l *.kicad_sch 2>/dev/null || true

            xdotool key --window "$wid" alt+F4 2>/dev/null || true
            sleep 2
            kill "$pid" 2>/dev/null || true
          '
          gui_rc=$?
          set -e
          cat ../artifacts/eeschema.log || true
          echo "GUI conversion rc=$gui_rc"
          ls -la *.kicad_sch || true
          test "$gui_rc" -eq 0
          test -s ax7010_servo_reva.kicad_sch

      - name: Verify native hierarchy and netlist
        run: |
          mkdir -p artifacts
          cd hardware
          kicad-cli sch export netlist \
            --output ../artifacts/ax7010_servo_reva.net \
            ax7010_servo_reva.kicad_sch
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path("../artifacts/ax7010_servo_reva.net").read_text()
          components = len(re.findall(r"\(comp\s+\(ref\s+", text))
          nets = len(re.findall(r"\(net\s+\(code\s+", text))
          print(f"netlist components={components} nets={nets}")
          if components != 124:
              raise SystemExit(f"expected 124 components, got {components}")
          if nets == 0:
              raise SystemExit("native netlist contains zero nets")
          PY

      - name: Run KiCad 10 native ERC
        run: |
          mkdir -p artifacts
          set +e
          cd hardware
          kicad-cli sch erc \
            --exit-code-violations \
            --severity-all \
            --output ../artifacts/ax7010_servo_reva_erc.rpt \
            ax7010_servo_reva.kicad_sch
          rc=$?
          set -e
          cat ../artifacts/ax7010_servo_reva_erc.rpt || true
          exit $rc

      - name: Upload conversion and ERC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-erc-report
          path: |
            artifacts/**
            hardware/*.kicad_sch
          if-no-files-found: warn
