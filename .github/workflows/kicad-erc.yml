name: kicad-erc

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'hardware/**'
      - 'tools/**'
      - '.github/workflows/kicad-erc.yml'

jobs:
  erc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad 10 CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            kicad kicad-footprints kicad-symbols
          kicad-cli --version

      - name: Preseed KiCad 10 user library tables
        run: |
          cfg="$HOME/.config/kicad/10.0"
          mkdir -p "$cfg"

          printf '(sym_lib_table\n  (version 7)\n)\n' > "$cfg/sym-lib-table"

          if [ -f /usr/share/kicad/template/fp-lib-table ]; then
            cp /usr/share/kicad/template/fp-lib-table "$cfg/fp-lib-table"
          else
            printf '(fp_lib_table\n  (version 7)\n)\n' > "$cfg/fp-lib-table"
          fi

          ls -lh "$cfg/sym-lib-table" "$cfg/fp-lib-table"

      - name: Validate native project symbol library with KiCad
        run: |
          kicad-cli sym upgrade --force \
            --output /tmp/ax7010_servo_reva.validated.kicad_sym \
            hardware/ax7010_servo_reva.kicad_sym
          test -s /tmp/ax7010_servo_reva.validated.kicad_sym

      - name: Verify native schematic source contract
        run: |
          python tools/check_native_schematic.py
          python tools/check_kicad_grid.py
          python tools/check_schematic_connectivity.py
          python tools/check_schematic_layout.py
          python tools/check_power_wiring.py

          test "$(find hardware -maxdepth 1 -name '*.kicad_sch' -type f | wc -l)" -eq 8
          test -s hardware/ax7010_servo_reva.kicad_sym
          test -z "$(find hardware -maxdepth 1 -name '*.sch' -type f -print -quit)"
          test -z "$(find hardware -maxdepth 1 -name '*.lib' -type f -print -quit)"
          test -s hardware/sym-lib-table

      - name: Export native KiCad netlist
        run: |
          mkdir -p artifacts
          cd hardware
          kicad-cli sch export netlist \
            --output ../artifacts/ax7010_servo_reva.net \
            ax7010_servo_reva.kicad_sch

          python3 ../tools/check_netlist_safety.py ../artifacts/ax7010_servo_reva.net
          python3 ../tools/check_ocp_behavior.py ../artifacts/ax7010_servo_reva.net
          kicad-cli sch export netlist --format kicadxml \
            --output ../artifacts/adc_validity.xml ax7010_servo_reva.kicad_sch
          python3 ../tools/check_adc_validity.py ../artifacts/adc_validity.xml \
            --output ../artifacts/adc_validity.json
          python3 ../tools/test_adc_validity.py --netlist ../artifacts/adc_validity.xml -v
          python3 ../tools/check_pcb_parity.py ../artifacts/ax7010_servo_reva.net --output ../artifacts/pcb_parity.json
          python3 ../tools/check_pcb_constraints.py ../artifacts/ax7010_servo_reva.net

      - name: Run KiCad 10 ERC on tracked native hierarchy
        run: |
          mkdir -p artifacts
          set +e
          cd hardware
          kicad-cli sch erc \
            --exit-code-violations \
            --severity-all \
            --output ../artifacts/ax7010_servo_reva_erc.rpt \
            ax7010_servo_reva.kicad_sch
          rc=$?
          set -e
          cat ../artifacts/ax7010_servo_reva_erc.rpt || true
          exit "$rc"

      - name: Upload ERC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-erc-report
          path: |
            artifacts/ax7010_servo_reva.net
            artifacts/pcb_parity.json
            artifacts/ax7010_servo_reva_erc.rpt
          if-no-files-found: warn
