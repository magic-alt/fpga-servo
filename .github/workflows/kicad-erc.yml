name: kicad-erc
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'hardware/**'
      - 'tools/**'
      - 'docs/**'
      - '.agents/**'
      - '.github/workflows/**'
      - 'AGENTS.md'
jobs:
  erc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native KiCad 10 and ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common ngspice
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-symbols kicad-footprints
          kicad-cli --version
          ngspice --version
      - name: Preseed KiCad library tables
        run: |
          cfg="$HOME/.config/kicad/10.0"
          mkdir -p "$cfg"
          printf '(sym_lib_table\n  (version 7)\n)\n' > "$cfg/sym-lib-table"
          if [ -f /usr/share/kicad/template/fp-lib-table ]; then
            cp /usr/share/kicad/template/fp-lib-table "$cfg/fp-lib-table"
          else
            printf '(fp_lib_table\n  (version 7)\n)\n' > "$cfg/fp-lib-table"
          fi
      - name: Validate both native symbol libraries without modifying sources
        run: |
          mkdir -p artifacts/library-validation
          kicad-cli sym upgrade --force --output artifacts/library-validation/ads8588s.kicad_sym hardware/ads8588s_servo/ax7010_servo_reva.kicad_sym
          kicad-cli sym upgrade --force --output artifacts/library-validation/ad7606c.kicad_sym hardware/ad7606c_servo/ax7010_servo_reva.kicad_sym
          test -s artifacts/library-validation/ads8588s.kicad_sym
          test -s artifacts/library-validation/ad7606c.kicad_sym
      - run: python tools/pcb.py verify --project ads8588s --scope schematic
      - run: python tools/pcb.py verify --project ad7606c --scope schematic
      - run: python tools/pcb.py test --kicad-cli kicad-cli --ngspice ngspice --pcb-python /usr/bin/python3
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-erc-report
          path: artifacts/
          if-no-files-found: warn
